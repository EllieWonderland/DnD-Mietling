name = "dnd-mietling-ws"
main = "src/index.js"
compatibility_date = "2024-11-01"

# Comma-separated list of origins allowed to open a socket, e.g.
# "https://dnd-mietling.vercel.app,http://localhost:5173".
# Left empty the relay accepts any origin — the room id in the URL is then
# the only gate (see todo.md, Punkte 5 und 6).
[vars]
ALLOWED_ORIGINS = ""

[[durable_objects.bindings]]
name = "RELAY_ROOM"
class_name = "RelayRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RelayRoom"]
